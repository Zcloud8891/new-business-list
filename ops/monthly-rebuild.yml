name: Monthly rebuild
on:
  schedule:
    - cron: '17 15 5-18 * *'   # daily 15:17 UTC (7:17 AM PT) on the 5th-18th, when the state posts last month
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "new-business-list-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A summaries docs
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Rebuild $(date -u +%Y-%m-%d)" && git push; fi
